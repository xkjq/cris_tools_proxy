[package]
name = "cris_tools_proxy"
version = "0.1.7"
edition = "2021"

[dependencies]
# ZeroMQ has trouble building on Windows gnu
#zmq = "0.10.0"
# So we use nng
nng = "1.0.1"
rfd = "0.14.1"
toml = "0.8.13"
# Edit the per-user preferences file in place so saving the launch preference
# keeps any comments or other settings the user added.
toml_edit = "0.22"
serde = { version = "1.0", features = ["derive"] }
# Human-readable timestamps in the persistent proxy log.
time = { version = "0.3", features = ["formatting"] }
# Unpack the versioned build zip into the local run cache.
zip = "2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
