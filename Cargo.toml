[package]
name = "cris_tools_proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
# ZeroMQ has trouble building on Windows gnu
#zmq = "0.10.0"
# So we use nng
nng = "1.0.1"
rfd = "0.14.1"
toml = "0.8.13"
serde = { version = "1.0", features = ["derive"] }
# Unpack the versioned build zip into the local run cache.
zip = "2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
