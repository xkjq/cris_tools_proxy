# Settings for cris_tools_proxy.exe.
#
# This file is looked up next to the executable first, then in the working
# directory, so Dragon can launch the proxy from any CWD.

# Port the CRIS Tools command listener binds. Must match `[commands].port` in
# the app's config/global.toml on the deployment share.
port = 5555

# Host/address of the command listener. Defaults to IPv4 loopback to match the
# app's own 127.0.0.1 bind. Set this if the app listens on a different host.
# host = "127.0.0.1"

# How long to wait for the app to accept a command and reply, in milliseconds.
# Increase this if an automation legitimately takes longer than 30 seconds.
# timeout_ms = 30000

# Fallback executable used when no published build is found in `app/`
# (legacy layout / first run before a build is published).
cris_tools_path = "path/to/cris-tools"

# Directory holding `app/current.txt` and the versioned build zips.
# Optional: defaults to the directory containing this config file (the
# deployment share). Relative paths are resolved against that directory.
# app_root = "."

# Refuse to send a command when the app's IPC token cannot be found, instead of
# falling back to the legacy `run/<command>` protocol. Enabled by default
# because deployed CRIS Tools builds reject untokened commands. Set false only
# during a controlled mixed-version rollout.
require_token = true

# Override the location of the app's per-run token file. Defaults to
# %LOCALAPPDATA%\cris-tools\ipc.token.
# ipc_token_file = "C:\\Users\\me\\AppData\\Local\\cris-tools\\ipc.token"

# Default for launching CRIS Tools automatically when it is not running.
# Users' saved choices in their per-user preferences file override this.
# launch_without_prompt = false

# Override the location of the per-user preferences file that stores whether
# to launch without asking. Defaults to %LOCALAPPDATA%\cris-tools\prefs.toml.
# preferences_file = "C:\\Users\\me\\AppData\\Local\\cris-tools\\prefs.toml"
